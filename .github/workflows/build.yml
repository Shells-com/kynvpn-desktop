name: Build

# Builds the client for every platform and keeps the installers, debug
# symbols, etc. as workflow artifacts.  Pushing a tag named v<version>
# (e.g. v1.0.0) also creates a draft GitHub release with the installers.
#
# Qt:
# - Linux and macOS use the open source Qt builds from Shells-com/kynvpn-qt
#   (release KYNVPN_QT_TAG).
# - Windows uses the official Qt binaries from download.qt.io (installed by
#   .github/scripts/install-qt-official.py).
#
# Code signing is optional and enabled by secrets:
# - macOS (secrets of the 'macos-signing' environment, limited to master and
#   v* tags; set them up with .github/scripts/setup-macos-signing.sh):
#   - signing: MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD,
#     MACOS_CODESIGN_IDENTITY (certificate common name)
#   - notarization (needs signing): APPLE_ID, APPLE_APP_PASSWORD,
#     APPLE_TEAM_ID
# - Windows (Azure Artifact Signing; variables of the 'windows-signing'
#   environment, limited to master and v* tags): AZURE_CLIENT_ID and
#   AZURE_TENANT_ID (app registration with a federated credential for that
#   environment and the Certificate Profile Signer role),
#   ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT,
#   ARTIFACT_SIGNING_PROFILE
on:
  push:
    branches: [master]
    tags: ['v*']  # path filters don't apply to tags
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: 6.12.0
  KYNVPN_QT_TAG: v6.12.0-1
  # Skips the Gemfile (pry/rspec are only for local development)
  GITHUB_CI: '1'
  VARIANT: release

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Same environment as the Qt build (glibc 2.34), so the client runs
    # wherever that Qt runs
    container: almalinux:9
    env:
      LFS_EXCLUDE: deps/built/mac/**,deps/built/win/**,deps/dump_syms/dump_syms.exe,deps/dump_syms/dump_syms_mac
    steps:
      - name: Install build dependencies
        run: |
          echo -e 'retries=10\nskip_if_unavailable=False' >> /etc/dnf/dnf.conf
          dnf -y --refresh install dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf -y --refresh install \
            git git-lfs clang llvm compiler-rt gcc-c++ ruby rubygem-rake \
            libnl3-devel mesa-libGL-devel mesa-libEGL-devel libglvnd-devel \
            libxkbcommon-devel fontconfig freetype glib2 dbus-libs \
            zip unzip xz which file findutils tar gzip
          # Runtime libraries of Qt and its xcb/wayland plugins, needed to run
          # the unit tests
          dnf -y install \
            libX11 libX11-xcb libXau libXdmcp libxcb libSM libICE \
            xcb-util xcb-util-cursor xcb-util-image xcb-util-keysyms \
            xcb-util-renderutil xcb-util-wm libxkbcommon-x11 \
            libwayland-client libwayland-cursor libwayland-egl \
            libwayland-server libdrm mesa-libgbm brotli
          dnf clean all
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # version is derived from tags
      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: List LFS objects
        run: git lfs ls-files -l --exclude "$LFS_EXCLUDE" | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-linux-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-linux-
      - name: Fetch LFS objects
        run: git lfs pull --exclude "$LFS_EXCLUDE"
      - name: Install Qt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf -y install gh
          pkg="qt-$QT_VERSION-kynvpn-linux-${{ matrix.arch }}.run"
          gh release download "$KYNVPN_QT_TAG" -R Shells-com/kynvpn-qt -p "$pkg" -D "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$pkg" -R Shells-com/kynvpn-qt
          sh "$RUNNER_TEMP/$pkg" -- /opt/Qt-kynvpn --yes
          rm "$RUNNER_TEMP/$pkg"
          echo "QTROOT=/opt/Qt-kynvpn/$QT_VERSION" >> "$GITHUB_ENV"
      - name: Build
        run: rake -j"$(nproc)" artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kyn-linux-${{ matrix.arch }}
          path: out/*/artifacts/
          if-no-files-found: error

  macos:
    name: macos-universal
    runs-on: macos-15
    # The signing/notarization secrets live in this environment, which only
    # master and v* tags can use, so other branches and PRs build unsigned.
    environment: ${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && 'macos-signing' || '' }}
    env:
      LFS_EXCLUDE: deps/built/linux/**,deps/built/win/**,deps/dump_syms/dump_syms.exe,deps/dump_syms/dump_syms_linux*.bin
      ARCHITECTURE: universal
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: List LFS objects
        run: git lfs ls-files -l --exclude "$LFS_EXCLUDE" | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-macos-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-macos-
      - name: Fetch LFS objects
        run: git lfs pull --exclude "$LFS_EXCLUDE"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Qt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg="qt-$QT_VERSION-kynvpn-macos-universal.run"
          gh release download "$KYNVPN_QT_TAG" -R Shells-com/kynvpn-qt -p "$pkg" -D "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$pkg" -R Shells-com/kynvpn-qt
          sh "$RUNNER_TEMP/$pkg" -- "$HOME/Qt-kynvpn" --yes
          rm "$RUNNER_TEMP/$pkg"
          echo "QTROOT=$HOME/Qt-kynvpn/$QT_VERSION" >> "$GITHUB_ENV"
      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "PIA_CODESIGN_CERT=$MACOS_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Build
        env:
          PIA_APPLE_ID_EMAIL: ${{ secrets.APPLE_ID }}
          PIA_APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          PIA_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PIA_APPLE_NOTARIZE_TIMEOUT: 1h
          # Empty for tags: a release build (release version number, always
          # notarized).  Branches other than master skip notarization.
          PIA_BRANCH_BUILD: ${{ github.ref_type != 'tag' && github.ref_name || '' }}
        run: rake -j"$(sysctl -n hw.ncpu)" artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kyn-macos-universal
          path: out/*/artifacts/
          if-no-files-found: error

  windows:
    name: windows-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            qt_host: windows_x86
            qt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
          - arch: arm64
            runner: windows-11-arm
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            qt_dir: msvc2022_arm64
    runs-on: ${{ matrix.runner }}
    # Signs with Azure Artifact Signing, configured by the variables of this
    # environment (only master and v* tags can use it)
    environment: ${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && 'windows-signing' || '' }}
    permissions:
      contents: read
      id-token: write  # Azure login (federated credential of windows-signing)
    env:
      LFS_EXCLUDE: deps/built/linux/**,deps/built/mac/**,deps/dump_syms/dump_syms_mac,deps/dump_syms/dump_syms_linux*.bin
      ARCHITECTURE: ${{ matrix.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        # Keep LF line endings as committed; some sources and scripts
        # require them
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: List LFS objects
        run: git lfs ls-files -l --exclude "$LFS_EXCLUDE" | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-windows-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-windows-
      - name: Fetch LFS objects
        run: git lfs pull --exclude "$LFS_EXCLUDE"
      - uses: ruby/setup-ruby@v1
        with:
          # Oldest release with Windows arm64 builds
          ruby-version: '3.4'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Qt
        run: |
          # Debug symbols of qtbase/qtdeclarative go into the debug symbol
          # artifact (for crash reports)
          python -I .github/scripts/install-qt-official.py --debug-info=qtbase,qtdeclarative \
            ${{ matrix.qt_host }} "$QT_VERSION" ${{ matrix.qt_arch }} 'C:/Qt' qtimageformats
          test -f "C:/Qt/$QT_VERSION/${{ matrix.qt_dir }}/bin/windeployqt.exe"
          echo "QTROOT=C:/Qt/$QT_VERSION" >> "$GITHUB_ENV"
      - name: Set up Artifact Signing
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        env:
          CLIENT_VERSION: 1.0.151
          CLIENT_SHA256: 35375a4bc4e1102da729fc3d8d9925f774c3baae6b8b7ff6398d948ca9ab0d8a
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          dir="$RUNNER_TEMP/artifact-signing"
          mkdir -p "$dir"
          # The signtool plugin (x64 only; arm64 runs it emulated)
          curl -fsSL -o "$dir/client.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$CLIENT_VERSION/microsoft.artifactsigning.client.$CLIENT_VERSION.nupkg"
          echo "$CLIENT_SHA256  $dir/client.nupkg" | sha256sum -c -
          unzip -q "$dir/client.nupkg" 'bin/x64/*' -d "$dir/client"
          # It needs the x64 .NET 10 runtime
          curl -fsSL -o "$dir/dotnet-install.ps1" https://dot.net/v1/dotnet-install.ps1
          pwsh -NoProfile -File "$dir/dotnet-install.ps1" -Runtime dotnet -Channel 10.0 \
            -Architecture x64 -InstallDir "$(cygpath -w "$dir/dotnet")" -NoPath
          # ...and an x64 signtool
          signtool="$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64/signtool.exe | sort -V | tail -n1)"
          test -n "$signtool"
          # Only authenticate with the GitHub OIDC token (see Build)
          python -I -c 'import json, sys; json.dump({"Endpoint": sys.argv[1], "CodeSigningAccountName": sys.argv[2], "CertificateProfileName": sys.argv[3], "ExcludeCredentials": ["EnvironmentCredential", "ManagedIdentityCredential", "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential", "AzureCliCredential", "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential"]}, open(sys.argv[4], "w"))' \
            "$ENDPOINT" "$ACCOUNT" "$PROFILE" "$dir/metadata.json"
          {
            echo "DOTNET_ROOT_X64=$(cygpath -w "$dir/dotnet")"
            echo "PIA_SIGNTOOL_EXE=$(cygpath -w "$signtool")"
            echo "PIA_SIGNTOOL_DLIB=$(cygpath -w "$dir/client/bin/x64/Azure.CodeSigning.Dlib.dll")"
            echo "PIA_SIGNTOOL_DMDF=$(cygpath -w "$dir/metadata.json")"
            echo "PIA_SIGNTOOL_TIMESTAMP_URL=http://timestamp.acs.microsoft.com"
            echo "AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}"
            echo "AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}"
            echo "AZURE_FEDERATED_TOKEN_FILE=$(cygpath -w "$dir/oidc-token")"
          } >> "$GITHUB_ENV"
      - name: Build
        run: |
          if [ -n "${AZURE_FEDERATED_TOKEN_FILE:-}" ]; then
            # GitHub OIDC tokens expire after a few minutes and the build signs
            # files for over an hour, so keep a fresh one in the file the
            # signtool plugin reads (it trades it for an Azure token)
            token="$(cygpath -u "$AZURE_FEDERATED_TOKEN_FILE")"
            refresh() {
              curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" |
                python -I -c 'import json, sys; sys.stdout.write(json.load(sys.stdin)["value"])' > "$token.new" &&
                mv -f "$token.new" "$token"
            }
            refresh
            (while sleep 60; do refresh || true; done) &
            trap "kill $!" EXIT
          fi
          rake -j"$NUMBER_OF_PROCESSORS" artifacts
      - name: Unit tests
        # Not part of 'artifacts' on Windows (no coverage measurement)
        run: rake -j"$NUMBER_OF_PROCESSORS" test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kyn-windows-${{ matrix.arch }}
          path: out/*/artifacts/
          if-no-files-found: error

  release:
    name: Draft release
    needs: [linux, macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kyn-*
          path: dist
      - name: Collect installers
        run: |
          mkdir release
          find dist -maxdepth 4 -path '*/artifacts/*' -type f \
            \( -name 'kyn-*.run' -o -name 'kyn-*.zip' -o -name 'kyn-*.exe' \) \
            -exec cp {} release/ \;
          ls -la release
          cd release && sha256sum * > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* -R "$GITHUB_REPOSITORY" \
            --draft --title "Kyn VPN $GITHUB_REF_NAME" --generate-notes
